[project]
name = "dbdoctor"
version = "0.1.0"
description = "PostgreSQL + MySQL performance advisor: agentless collectors, deterministic rule engine, expert-reviewed reports."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "bcrypt>=4.1",
    "click>=8.1",
    "email-validator>=2.0",
    "fastapi>=0.111",
    "jinja2>=3.1",
    "playwright>=1.45",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[project.scripts]
dbdoctor-audit = "cli.audit:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "httpx>=0.27",
]
testbed = [
    "psycopg[binary]>=3.1",
    "pymysql>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine", "report", "webapp", "cli", "collector"]

[tool.pytest.ini_options]
testpaths = ["tests", "webapp/backend/tests"]
markers = [
    "integration: tests that require the docker-compose testbed to be running",
]
addopts = "-m 'not integration'"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["webapp/frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom uses calls in argument defaults
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.security.HTTPBearer",
]

[tool.ruff.lint.per-file-ignores]
# one source-mapping description per line beats wrapped fragments
"engine/models.py" = ["E501"]
